services:

  postgres:
    image: postgres:16-alpine
    container_name: flood_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       floodmonitor
      POSTGRES_USER:     flooduser
      POSTGRES_PASSWORD: P@ssw0rd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U flooduser -d floodmonitor"]
      interval: 10s
      timeout:  5s
      retries:  5
    networks:
      - flood_net

  backend:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: flood_backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      DB_HOST: postgres
    ports:
      - "5000:5000"
    volumes:
      - hls_data:/app/hls
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flood_net
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout:  10s
      retries:  10
      start_period: 30s

  migrate:
    build:
      context:    ./backend
      dockerfile: Dockerfile
    container_name: flood_migrate
    env_file: .env.docker
    environment:
      DB_HOST: postgres
    command: node src/config/migrate.js
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flood_net
    restart: "no"

  frontend:
    build:
      context:    ./frontend
      dockerfile: Dockerfile
    container_name: flood_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - flood_net

  # detection:
  #   build:
  #     context:    ../../flood_ai
  #     dockerfile: Dockerfile
  #   container_name: flood_detection
  #   restart: unless-stopped
  #   env_file: .env.docker
  #   environment:
  #     BACKEND_URL:    http://backend:5000
  #     CAMERA_API_KEY: ${CAMERA_API_KEY}
  #     CAMERA_CODE:    ${CAMERA_CODE}
