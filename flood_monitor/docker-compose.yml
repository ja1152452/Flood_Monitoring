  #     - "host.docker.internal:host-gateway"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - flood_net

volumes:
  postgres_data:
    name: flood_postgres_data
  hls_data:
    name: flood_hls_data

networks:
  flood_net:
    name:   flood_network
    driver: bridge